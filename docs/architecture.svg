<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" stroke="#6E7781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 28px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1F2328; }
      .subtitle { font: 400 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #59636E; }
      .section { font: 700 17px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1F2328; }
      .body { font: 400 14px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #3D444D; }
      .note { font: 400 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #59636E; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#FCFCFB"/>

  <text x="64" y="60" class="title">A2AWall architecture</text>
  <text x="64" y="88" class="subtitle">Standard A2A at the edge, security enforcement through the gateway and runtime.</text>

  <rect x="64" y="150" width="200" height="92" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="88" y="186" class="section">A2A clients</text>
  <text x="88" y="212" class="body">Discover the agent and</text>
  <text x="88" y="232" class="body">call standard endpoints.</text>

  <rect x="332" y="136" width="240" height="120" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="356" y="172" class="section">Gateway admission</text>
  <text x="356" y="198" class="body">Authenticate the caller and</text>
  <text x="356" y="218" class="body">evaluate capability, scopes,</text>
  <text x="356" y="238" class="body">trust tier, and approvals.</text>

  <rect x="640" y="136" width="220" height="120" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="664" y="172" class="section">A2A surface</text>
  <text x="664" y="198" class="body">Expose the Agent Card,</text>
  <text x="664" y="218" class="body">JSON-RPC, REST, and</text>
  <text x="664" y="238" class="body">security metadata.</text>

  <rect x="928" y="136" width="208" height="120" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="952" y="172" class="section">Secure runtime</text>
  <text x="952" y="198" class="body">Validate actions and</text>
  <text x="952" y="218" class="body">enforce sandbox rules</text>
  <text x="952" y="238" class="body">before execution.</text>

  <rect x="116" y="370" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="140" y="406" class="section">Trusted context</text>
  <text x="140" y="432" class="body">Keep system and developer</text>
  <text x="140" y="452" class="body">instructions separate from</text>
  <text x="140" y="472" class="body">untrusted inputs.</text>

  <rect x="388" y="370" width="236" height="110" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="412" y="406" class="section">Memory and retrieval</text>
  <text x="412" y="432" class="body">Control memory writes and</text>
  <text x="412" y="452" class="body">classify retrieved content</text>
  <text x="412" y="472" class="body">before use.</text>

  <rect x="676" y="370" width="196" height="110" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="700" y="406" class="section">Delegation</text>
  <text x="700" y="432" class="body">Limit recursion, fan-out,</text>
  <text x="700" y="452" class="body">and capability propagation</text>
  <text x="700" y="472" class="body">across agents.</text>

  <rect x="924" y="370" width="212" height="110" rx="10" fill="#FFFFFF" stroke="#D8DEE4"/>
  <text x="948" y="406" class="section">Tools and actions</text>
  <text x="948" y="432" class="body">Run tools only after</text>
  <text x="948" y="452" class="body">validation and sandbox</text>
  <text x="948" y="472" class="body">approval.</text>

  <path d="M264 196H320" stroke="#6E7781" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M572 196H628" stroke="#6E7781" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M860 196H916" stroke="#6E7781" stroke-width="2" marker-end="url(#arrow)"/>

  <path d="M452 256V334" stroke="#6E7781" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M744 256V334" stroke="#6E7781" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1032 256V334" stroke="#6E7781" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="64" y="566" class="note">Baseline A2A compatibility stays intact. A2AWall adds enforcement in the gateway and runtime, with supporting controls for context, memory, retrieval, delegation, and tools.</text>
</svg>
