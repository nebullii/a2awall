<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F0E6"/>
      <stop offset="1" stop-color="#EFE4D5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F9F1E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6E4B33" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="7" orient="auto">
      <path d="M1 1L11 7L1 13" stroke="#8B4B26" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font: 700 20px Georgia, serif; fill: #1D1B18; }
      .subtitle { font: 600 14px Georgia, serif; letter-spacing: 0.08em; text-transform: uppercase; fill: #8B4B26; }
      .label { font: 700 18px Georgia, serif; fill: #1D1B18; }
      .copy { font: 15px Georgia, serif; fill: #5B554E; }
      .small { font: 600 13px Georgia, serif; fill: #8B4B26; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>

  <text x="70" y="78" class="subtitle">A2AWall Architecture</text>
  <text x="70" y="118" class="title">A2A compatibility at the edge, security controls through the stack.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="220" height="120" rx="26" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="100" y="220" class="label">A2A Clients</text>
    <text x="100" y="248" class="copy">Generic clients discover</text>
    <text x="100" y="270" class="copy">the agent card and call</text>
    <text x="100" y="292" class="copy">baseline A2A endpoints.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="150" width="350" height="160" rx="30" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="390" y="198" class="label">Gateway Admission Layer</text>
    <text x="390" y="228" class="copy">Bearer auth, capability allowlists, scope checks,</text>
    <text x="390" y="250" class="copy">trust-tier evaluation, approval gates, request sizing.</text>
    <text x="390" y="284" class="small">policy.ts  admission.ts  middleware.ts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="150" width="350" height="160" rx="30" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="810" y="198" class="label">A2A Surface</text>
    <text x="810" y="228" class="copy">Agent Card, JSON-RPC, REST, capability metadata,</text>
    <text x="810" y="250" class="copy">security extensions, allowed tools and risk hints.</text>
    <text x="810" y="284" class="small">executor.ts  app.ts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="150" y="390" width="310" height="180" rx="28" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="180" y="438" class="label">Trusted Context Boundary</text>
    <text x="180" y="468" class="copy">Separates system and developer instructions from</text>
    <text x="180" y="490" class="copy">user, retrieval, memory, tool, and peer-agent input.</text>
    <text x="180" y="524" class="small">context/envelope.ts  context/trust.ts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="500" y="370" width="350" height="220" rx="30" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="530" y="418" class="label">Secure Runtime</text>
    <text x="530" y="448" class="copy">Validated action proposals are checked before</text>
    <text x="530" y="470" class="copy">tool execution. Sandbox rules constrain what each</text>
    <text x="530" y="492" class="copy">capability may touch.</text>
    <text x="530" y="526" class="small">runtime/secure-runtime.ts</text>
    <text x="530" y="548" class="small">runtime/sandbox.ts</text>
    <text x="530" y="570" class="small">validation/output.ts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="890" y="390" width="240" height="180" rx="28" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="920" y="438" class="label">Tools &amp; Actions</text>
    <text x="920" y="468" class="copy">Registered tools run only</text>
    <text x="920" y="490" class="copy">after validation and</text>
    <text x="920" y="512" class="copy">sandbox admission.</text>
    <text x="920" y="546" class="small">runtime/tools.ts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="620" width="300" height="92" rx="24" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="280" y="662" class="label">Memory &amp; Retrieval Policies</text>
    <text x="280" y="690" class="small">memory/store.ts  retrieval/policy.ts</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="620" width="300" height="92" rx="24" fill="url(#panel)" stroke="#D8C1A9"/>
    <text x="680" y="662" class="label">Delegation Controls</text>
    <text x="680" y="690" class="small">orchestration/delegation.ts</text>
  </g>

  <path d="M290 230H338" stroke="#8B4B26" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M710 230H758" stroke="#8B4B26" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M535 310V350" stroke="#8B4B26" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M780 480H868" stroke="#8B4B26" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M400 570V605" stroke="#8B4B26" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M800 590V605" stroke="#8B4B26" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M460 480H480" stroke="#8B4B26" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="76" y="736" class="small">Baseline A2A compatibility remains intact. Security controls are enforced in the gateway and runtime layers.</text>
</svg>
